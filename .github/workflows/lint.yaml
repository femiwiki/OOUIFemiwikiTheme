name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  parallel-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - env:
          PARALLEL_LINT_URL: https://github.com/php-parallel-lint/PHP-Parallel-Lint/releases/download/v1.4.0/parallel-lint.phar
          PARALLEL_LINT_SHA256: 7f584ddcb39e36ea491b3fbca133abeb623c1a26d90ef44c494379025c233ce5
        run: |
          curl -sSfL -o "$RUNNER_TEMP/parallel-lint.phar" "$PARALLEL_LINT_URL"
          echo "$PARALLEL_LINT_SHA256  $RUNNER_TEMP/parallel-lint.phar" | sha256sum -c -
          php "$RUNNER_TEMP/parallel-lint.phar" dist

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: shellcheck build.sh
